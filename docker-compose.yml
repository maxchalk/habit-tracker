# docker-compose.yml

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: habit-tracker-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: habit-tracker
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - habit-tracker-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habit-tracker-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://admin:password123@mongodb:27017/habit-tracker?authSource=admin
      - JWT_SECRET=your-super-secret-jwt-key-here-make-it-long-and-random
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - habit-tracker-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: habit-tracker-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - habit-tracker-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: habit-tracker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - habit-tracker-network

volumes:
  mongodb_data:
  redis_data:

networks:
  habit-tracker-network:
    driver: bridge